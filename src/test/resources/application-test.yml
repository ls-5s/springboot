# 测试环境：使用 MySQL，@Transactional 自动回滚
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo3_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_user.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: error

# 关闭文档
springdoc:
  api-docs:
    enabled: false
